name: 3DS build

# Builds heretic.3dsx with devkitARM and packs heretic.cia on every push
# and pull request.  Pushing a version tag (v*) also attaches the build to that tag's
# GitHub release, creating the release if it does not exist yet.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  MAKEROM_URL: https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
  BANNERTOOL_URL: https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip

jobs:
  build:
    name: Build heretic.3dsx
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -C port3ds -j"$(nproc)"

      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: heretic-3dsx-${{ github.sha }}
          path: |
            port3ds/heretic.3dsx
            port3ds/heretic.elf
          if-no-files-found: error

  # The .cia is packed outside the devkitARM container: makerom's Linux
  # build needs a newer glibc than the container has.  It only needs the
  # ELF from the build job and the files in port3ds/meta/.
  cia:
    name: Pack heretic.cia
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 3dsx
        uses: actions/download-artifact@v4
        with:
          name: heretic-3dsx-${{ github.sha }}
          path: port3ds

      - name: Install CIA tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL -o makerom.zip "$MAKEROM_URL"
          curl -fsSL -o bannertool.zip "$BANNERTOOL_URL"
          unzip -o -q makerom.zip
          unzip -o -q bannertool.zip
          sudo install -m 755 makerom /usr/local/bin/makerom
          sudo install -m 755 linux-x86_64/bannertool /usr/local/bin/bannertool

      # The version shown on the 3DS comes from the tag (v0.4 -> 0.4.0);
      # untagged builds are 0.0.0.
      - name: Build CIA
        working-directory: port3ds
        run: |
          ver=0.0.0
          case "$GITHUB_REF" in
            refs/tags/v*) ver="${GITHUB_REF#refs/tags/v}" ;;
          esac
          IFS=. read -r major minor micro <<EOF
          $ver
          EOF
          title=$(sed -n 's/^APP_TITLE *:= *//p' Makefile)
          desc=$(sed -n 's/^APP_DESCRIPTION *:= *//p' Makefile)
          author=$(sed -n 's/^APP_AUTHOR *:= *//p' Makefile)
          sh meta/make_cia.sh heretic.elf heretic.cia "$title" "$desc" \
            "$author" "${major:-0}" "${minor:-0}" "${micro:-0}"

      # heretic.elf carries the debug symbols needed to read a Luma3DS
      # crash dump from this exact build (arm-none-eabi-addr2line).
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: heretic-3ds-${{ github.sha }}
          path: |
            port3ds/heretic.3dsx
            port3ds/heretic.cia
            port3ds/heretic.elf
          if-no-files-found: error

  release:
    name: Attach to release
    needs: cia
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: heretic-3ds-${{ github.sha }}

      # Adds or replaces the files on the release.  An existing release
      # keeps its title and notes.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            heretic.3dsx
            heretic.cia
            heretic.elf
          fail_on_unmatched_files: true
