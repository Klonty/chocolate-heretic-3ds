name: 3DS build

# Builds heretic.3dsx with devkitARM on every push and pull request.
# Pushing a version tag (v*) also attaches the build to that tag's GitHub
# release, creating the release if it does not exist yet.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build heretic.3dsx
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -C port3ds -j"$(nproc)"

      # heretic.elf carries the debug symbols needed to read a Luma3DS
      # crash dump from this exact build (arm-none-eabi-addr2line).
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: heretic-3ds-${{ github.sha }}
          path: |
            port3ds/heretic.3dsx
            port3ds/heretic.elf
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: heretic-3ds-${{ github.sha }}

      # Adds or replaces the files on the release.  An existing release
      # keeps its title and notes.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            heretic.3dsx
            heretic.elf
          fail_on_unmatched_files: true
